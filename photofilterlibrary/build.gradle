plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.uvstudio.him.photofilterlibrary'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 200
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Optional Compose support (compileOnly so it doesn't force Compose on non-Compose apps)
    compileOnly 'androidx.compose.ui:ui:1.6.8'
    compileOnly 'androidx.compose.runtime:runtime:1.6.8'
    compileOnly 'androidx.compose.ui:ui-graphics:1.6.8'

    // Optional Image Loader transformations (compileOnly)
    compileOnly 'io.coil-kt:coil:2.6.0'
    compileOnly 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'androidx.compose.ui:ui-graphics:1.6.8'
    testImplementation 'io.coil-kt:coil:2.6.0'
    testImplementation 'com.github.bumptech.glide:glide:4.16.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.hgayan7'
                artifactId = 'FilterLibrary'
                version = '2.0.0'
            }
        }
    }
}
